# Netlify build for the web app in this npm-workspaces monorepo.
# Netlify detects Next.js and applies its runtime (@netlify/plugin-nextjs)
# automatically; do not pin it.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Supabase URL, publishable key and NEXT_PUBLIC_SITE_URL are set in the Netlify
# project settings (env vars in this file don't reach the runtime functions).
